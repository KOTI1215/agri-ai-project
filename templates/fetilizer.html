<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agri-AI Fertilizer Recommendation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 700px;">
        <h1 class="mb-4 text-success">🌱 Fertilizer & Nutrient Tool</h1>
        
        <form action="/fertilizer" method="POST" class="card shadow-sm p-4 mb-4">
            <div class="mb-3">
                <label class="form-label fw-bold">Select Crop</label>
                <select name="crop" class="form-select">
                    <option value="Paddy" {% if crop == 'Paddy' %}selected{% endif %}>Paddy (Rice)</option>
                    <option value="Maize" {% if crop == 'Maize' %}selected{% endif %}>Maize</option>
                    <option value="Cotton" {% if crop == 'Cotton' %}selected{% endif %}>Cotton</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Soil Type</label>
                <select name="soil" class="form-select">
                    <option value="Alluvial" {% if soil == 'Alluvial' %}selected{% endif %}>Alluvial Soil</option>
                    <option value="Red" {% if soil == 'Red' %}selected{% endif %}>Red Soil</option>
                    <option value="Black" {% if soil == 'Black' %}selected{% endif %}>Black Soil</option>
                </select>
            </div>
            <button class="btn btn-success w-100" type="submit">Get Fertilizer Guidelines</button>
        </form>

        {% if recommendation %}
            <div class="card shadow p-4 mb-4 bg-success bg-opacity-10 border-success">
                <h3 class="text-success">🌿 NPK Recommendation for {{ crop }}</h3>
                <p class="fs-5 mb-0"><strong>{{ recommendation }}</strong></p>
            </div>
        {% endif %}

        <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
</body>
</html>
