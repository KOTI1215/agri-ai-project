<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agri-AI Smart Farming System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 700px;">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-success">🌱 Agri-AI Smart Farming System</h1>
            <p class="lead text-muted">Your intelligent companion for crop monitoring, weather analysis, and smart irrigation.</p>
        </div>

        <!-- City Weather Search Box -->
        <div class="card shadow-sm p-4 mb-4">
            <h3>Check Live Weather & Farm Advisory</h3>
            <form action="/weather" method="POST" class="input-group mt-3">
                <input type="text" name="city" class="form-control" placeholder="Enter any city name (e.g. Srikakulam)..." required>
                <button class="btn btn-success" type="submit">Get Weather</button>
            </form>
        </div>
    </div>
</body>
</html>
